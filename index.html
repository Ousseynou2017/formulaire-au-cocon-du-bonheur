<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chargement…</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  Coquille vide volontaire.
  Tout le contenu visible est construit par app.js a partir de config.json et
  questions.json. Ne rien ecrire en dur ici : ni question, ni libelle, ni nom de client.
-->

<a class="lien-evitement" href="#zone-principale" id="lien-evitement"></a>

<header class="entete" id="entete" hidden>
  <div class="entete__haut">
    <img class="entete__logo" id="logo" alt="" hidden>
    <p class="entete__client" id="entete-client"></p>
    <button type="button" class="bouton bouton--discret entete__sommaire" id="btn-sommaire"
            aria-expanded="false" aria-controls="sommaire"></button>
  </div>

  <div class="progression" id="progression" hidden>
    <div class="progression__ligne">
      <span class="progression__etape" id="progression-etape"></span>
      <span class="progression__pourcent" id="progression-pourcent"></span>
    </div>
    <div class="progression__piste" id="progression-piste"
         role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progression__jauge" id="progression-jauge"></div>
    </div>
  </div>
</header>

<!-- Sommaire : panneau lateral, accessible depuis n'importe quelle section -->
<div class="sommaire" id="sommaire" hidden>
  <div class="sommaire__voile" id="sommaire-voile"></div>
  <nav class="sommaire__panneau" aria-labelledby="sommaire-titre">
    <div class="sommaire__entete">
      <h2 class="sommaire__titre" id="sommaire-titre"></h2>
      <button type="button" class="bouton-icone" id="btn-fermer-sommaire"></button>
    </div>
    <ul class="sommaire__liste" id="sommaire-liste"></ul>
  </nav>
</div>

<main class="zone" id="zone-principale" tabindex="-1">
  <!-- Annonce des changements d'ecran aux lecteurs d'ecran -->
  <p class="lecteur-seul" aria-live="polite" id="annonce"></p>

  <!-- Rappel non bloquant : penser a telecharger une copie. Affiche une seule fois. -->
  <div class="bandeau" id="bandeau" hidden>
    <p class="bandeau__texte" id="bandeau-texte"></p>
    <button type="button" class="bouton-icone" id="bandeau-fermer"></button>
  </div>

  <div id="ecran"></div>
</main>

<!-- Barre d'action fixe en bas : atteignable au pouce -->
<div class="barre-bas" id="barre-bas" hidden>
  <button type="button" class="bouton bouton--contour" id="btn-precedent"></button>
  <button type="button" class="bouton bouton--principal" id="btn-suivant"></button>
</div>

<footer class="pied" id="pied" hidden>
  <button type="button" class="bouton bouton--lien" id="btn-telecharger"></button>
</footer>

<!--
  Copie embarquee de config.json et questions.json, pour que la page fonctionne
  sans reseau (rechargement hors connexion) et en file://.
  LES FICHIERS .json RESTENT LA SOURCE DE VERITE.
  Apres toute modification de l'un d'eux : node sync-inline.mjs
-->

    },
