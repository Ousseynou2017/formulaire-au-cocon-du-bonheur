<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://formspree.io; form-action https://formspree.io; base-uri 'none'">
<title>Réunion Anna 03/11</title>
<style>
[hidden]{display:none!important}
/* Charte Au Cocon : carte blanche sur fond lilas, violet pour l'action. Thème clair seul, par choix. Polices du téléphone, rien d'externe. */
:root{
  --violet:#873897; --violet-fonce:#5A2166; --violet-clair:#F6EDF8;
  --creme:#FDF6E6; --fond:#EFE9F1; --carte:#FFFFFF;
  --encre:#331F3A; --titre:#5E4966; --doux:#5A4862; --filet:#EADFEC;
  --ok:#1D6B44;
  --f-texte:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--f-texte);font-size:16px;line-height:1.5}
.cadre{max-width:640px;margin:0 auto;padding-block:20px 120px;padding-inline:16px}
.marque{font-weight:600;color:var(--violet-fonce);font-size:15px;margin:0 0 4px}
h1,h2{font-weight:700;color:var(--violet-fonce);line-height:1.2;margin:0 0 6px;text-wrap:balance}
h1{font-size:26px} h2{font-size:21px} h2:focus{outline:none}
.aide{color:var(--doux);font-size:14px;margin:0 0 14px}
.barre{height:6px;background:var(--filet);border-radius:999px;overflow:hidden;margin:6px 0 16px}
.barre i{display:block;height:100%;background:var(--violet);width:0;transition:width .25s}
details.partie{background:var(--carte);border:1px solid var(--filet);border-radius:18px;margin-bottom:12px}
details.partie>summary{list-style:none;cursor:pointer;padding:16px 16px;display:flex;align-items:center;gap:10px;border-radius:18px;min-height:56px}
details.partie>summary::-webkit-details-marker{display:none}
details.partie>summary:focus-visible{outline:2px solid var(--violet);outline-offset:-2px}
summary .titre{flex:1;min-width:0;font-weight:600;color:var(--violet-fonce);font-size:16px;line-height:1.3}
summary .compte{font-size:12px;color:var(--doux);white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--violet-clair);border-radius:999px;padding:3px 9px}
summary .compte.plein{background:#E3F2E9;color:var(--ok)}
summary .fleche{width:10px;height:10px;border-right:2px solid var(--doux);border-bottom:2px solid var(--doux);transform:rotate(45deg);transition:transform .2s;flex:none;margin-top:-4px}
details[open]>summary .fleche{transform:rotate(-135deg);margin-top:4px}
.corps{padding:0 16px 16px}
.corps>.aide{margin-top:-4px}
.q{border-top:1px solid var(--filet);padding:14px 0 4px}
.q:first-of-type{border-top:0;padding-top:4px}
.q .lib{font-weight:500;font-size:15px;margin:0 0 8px;color:var(--encre)}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puce{font:inherit;font-size:14px;border:1px solid #D9C8DE;background:var(--carte);color:var(--encre);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:42px;text-align:left}
.puce:hover{border-color:var(--violet)}
.puce:active{transform:scale(.97)}
.puce[aria-pressed=true]{background:var(--violet);border-color:var(--violet);color:#fff}
.puce:focus-visible,.bouton:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
label.note{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--titre);margin-top:10px}
input[type=text],input[type=number],input[type=date],textarea{font:inherit;font-size:16px;color:var(--encre);background:var(--creme);border:1px solid var(--filet);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.facultatif{color:var(--doux);font-weight:400}
.carte{background:var(--carte);border:1px solid var(--filet);border-radius:18px;padding:20px 16px}
.recap{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--creme);border:1px solid var(--filet);border-radius:12px;padding:14px;font-size:14px;max-height:55vh;overflow:auto}
nav.pied{position:fixed;left:0;right:0;bottom:0;background:var(--carte);border-top:1px solid var(--filet);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
nav.pied .dedans{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.total{font-size:13px;color:var(--doux);white-space:nowrap;font-variant-numeric:tabular-nums}
.bouton{font:inherit;font-weight:600;font-size:16px;border-radius:999px;padding:12px 18px;cursor:pointer;border:1px solid var(--violet);min-height:48px}
.bouton:active{transform:scale(.98)}
.bouton.plein{background:var(--violet);color:#fff;flex:1}
.bouton.plein:hover{background:var(--violet-fonce)}
.bouton.vide{background:var(--carte);color:var(--violet-fonce);border-color:#D9C8DE}
.bouton.vide:hover{border-color:var(--violet)}
.bouton[disabled]{opacity:.6;cursor:wait}
.petit{font-size:13px;color:var(--doux);margin:8px 0 0}
.enregistre{font-size:12px;color:var(--ok);min-height:18px;margin:0}
.piege{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){.barre i,summary .fleche{transition:none}.puce:active,.bouton:active{transform:none}}
</style>
</head>
<body>
<div class="cadre">
  <p class="marque">Au Cocon Du Bonheur</p>
  <h1>Réunion avec Anna, 03/11</h1>
  <p class="aide">Les photos (cahiers, feuilles de présence) : envoie-les à part sur WhatsApp.</p>
  <div class="barre" aria-hidden="true"><i id="barre"></i></div>

  <form id="f" novalidate>
    <div class="piege" aria-hidden="true"><label>Ne pas remplir <input type="text" name="_gotcha" id="gotcha" tabindex="-1" autocomplete="off"></label></div>
    <div id="parties"></div>
    <section class="carte" id="vueRecap" hidden>
      <h2 tabindex="-1" id="titreRecap">Récapitulatif</h2>
      <p class="aide">Voici ce qui partira. Touche « Modifier » pour corriger.</p>
      <div class="recap" id="recap" tabindex="0"></div>
      <p class="petit" id="envoiEtat" role="status"></p>
    </section>
    <section class="carte" id="vueFin" hidden>
      <h2 tabindex="-1" id="titreFin">C’est envoyé</h2>
      <p class="aide">Les réponses sont parties sur Formspree. Elles restent aussi sur ce téléphone.</p>
      <button type="button" class="bouton vide" id="rouvrir">Modifier les réponses</button>
    </section>
  </form>
  <p class="enregistre" id="enregistre" role="status"></p>
</div>

<nav class="pied" id="pied">
  <div class="dedans" id="piedForm">
    <span class="total" id="total"></span>
    <button type="button" class="bouton plein" id="voir">Voir le récapitulatif</button>
  </div>
  <div class="dedans" id="piedRecap" hidden>
    <button type="button" class="bouton vide" id="modifier">Modifier</button>
    <button type="button" class="bouton plein" id="envoyer">Envoyer</button>
  </div>
</nav>

<script>
(function(){
  const CLE='aucocon-reunion-anna-0311';
  const ENVOI='https://formspree.io/f/xrennzzp';
  const TEST=new URLSearchParams(location.search).has('test');
  const SUJET=(TEST?'TEST – ':'')+'Au Cocon – réunion Anna 03/11';

  /* Une question : id, q (texte complet repris dans la réponse), o (choix), n (note : si = choix qui l'ouvrent, vide = toujours ; t = text, number, date, long) */
  const OK=['OK','Erreur'],NOTE_ERR={si:['Erreur'],lib:'Note'};
  const PAYE=['Payé','Pas payé','Ne sait pas'],MONTANT={si:['Payé'],t:'number',lib:'Montant payé (en F)'};
  const ON=['Oui','Non'];
  const CLASSES=['Crèche','TPS','PS','MS','GS','CI','CP','CE1','CE2','CM1','CM2'];
  const INSCRITS=['Dieynabou S. (62 000 F dans le fichier)','Sokhna Diarra G.','Aïcha G.','Aïssatou N.','Ramatoulaye N.','Cheikh Ahmadou Bamba M.','Mouhamadou Mansour D.','Ndeye Cathy F.'];
  const PARTIES=[
    {t:'Élèves : vérification par échantillon',aide:'1 élève par classe, comparé au registre d’Anna : nom, classe, date d’arrivée.',qs:[
      ...CLASSES.map(c=>({id:'ech-'+c,q:'Élève vérifié en '+c+' :',o:OK,n:NOTE_ERR})),
      {id:'ech-partis',q:'Élèves partis (3 vérifiés) :',o:OK,n:NOTE_ERR}
    ]},
    {t:'Qui est qui',qs:[
      {id:'qui-aminata',q:'Aminata Rassoul W. (MS) et Aminata Rassoul S. :',o:['Même enfant','Deux enfants','À vérifier']},
      {id:'qui-adja',q:'Adja Fatou F., notée en CP et en CE1 :',o:['CP','CE1','Deux enfants différents']},
      {id:'qui-ndeye',q:'Ndeye Maguette G., en double en CE1 :',o:['Même enfant','Deux enfants']},
      {id:'qui-moustapha',q:'Moustapha S., noté parti le 23/10 :',o:['Parti pour de bon','Toujours à l’école']}
    ]},
    {t:'Inscriptions marquées non payées',aide:'Pour chacun : payé ou non, et le montant si payé.',qs:
      INSCRITS.map((x,i)=>({id:'insc-'+i,q:'Inscription de '+x+' :',o:PAYE,n:MONTANT}))
    },
    {t:'Montants',qs:[
      {id:'mt-collation',q:'38 enfants notés sans collation :',o:['Bon nombre','Pas bon'],n:{si:['Pas bon'],t:'number',lib:'Nombre exact'}},
      ...['Loucia','Pape Ibrahima Ndao N.','Marieme F.'].map((x,i)=>({id:'mt-double-'+i,q:'Montant écrit 2 fois dans le fichier, '+x+' :',o:['Payé une fois','Payé deux fois','Ne sait pas']})),
      ...['Abdoulaye S.','Ndeye Fatou G.','Sokhna Diarra G.'].map((x,i)=>({id:'mt-absent-'+i,q:'Absent des mensualités, '+x+' :',o:['Toujours inscrit','Parti','Ne sait pas']})),
      {id:'mt-creche-juillet',q:'La crèche paie juillet :',o:ON},
      {id:'mt-tps-juillet',q:'La TPS paie juillet :',o:ON},
      {id:'mt-reclame',q:'Une inscription non payée est réclamée à partir du :',o:['01/10','01/11','Autre date'],n:{si:['Autre date'],t:'date',lib:'Date'}},
      {id:'mt-valide',q:'Section Paiements validée par Anna (échantillon 1 élève par classe concordant) :',o:['Oui','Non, erreurs'],n:{si:['Non, erreurs'],lib:'Note'}}
    ]},
    {t:'Familles (frères et sœurs)',qs:[
      {id:'fam-comment',q:'Comment l’école sait que deux enfants sont frères et sœurs :',o:['Même téléphone du parent','Même nom du père','Elle ne le note pas','Autre'],n:{si:['Autre'],lib:'Note'}},
      {id:'fam-tel',q:'Les parents ont un numéro de téléphone noté :',o:['Tous','Certains','Aucun']},
      {id:'fam-reduc',q:'Une réduction existe pour les frères et sœurs :',o:ON,n:{si:['Oui'],lib:'Laquelle'}},
      {id:'fam-corriger',q:'Fratries à corriger :',o:[],n:{si:[],t:'long',lib:'Note'}}
    ]},
    {t:'Enseignants : présences',qs:[
      {id:'ens-papier',q:'Anciennes présences, absences ou retards notés sur papier :',o:ON,n:{si:['Oui'],t:'date',lib:'Depuis le'}},
      {id:'ens-photos',q:'Photos prises :',o:ON},
      {id:'ens-bilan',q:'Le bilan sert à :',o:['Salaire','Rapport à la direction','Les deux','Autre'],n:{si:['Autre'],lib:'Note'}},
      {id:'ens-periode',q:'Période la plus utile :',o:['Mois','2 mois','Trimestre']},
      {id:'ens-total',q:'Ajouter le total des présences dans le bilan :',o:ON},
      {id:'ens-menu',q:'Mettre le bilan aussi dans le menu Enseignants :',o:ON},
      {id:'ens-heure',q:'Noter l’heure d’arrivée pour un retard :',o:ON},
      {id:'ens-par',q:'Présence notée par :',o:['Classe (comme aujourd’hui)','Enseignant (suit la personne si elle change de classe)']}
    ]},
    {t:'Élèves : absences',qs:[
      {id:'abs-appel',q:'L’appel se fait :',o:['Dans l’appli par les enseignants','Sur cahier','Pas encore fait']},
      {id:'abs-papier',q:'Anciennes absences sur papier à saisir :',o:ON}
    ]},
    {t:'Emploi du temps',qs:[
      {id:'edt-rempli',q:'Rempli dans l’appli :',o:['Toutes les classes','Certaines','Aucune']},
      {id:'edt-semaine',q:'Semaine type ou semaine datée :',o:['Semaine type suffit','Besoin d’une semaine datée']},
      {id:'edt-imprimer',q:'Imprimer toutes les classes d’un coup :',o:ON},
      {id:'edt-feuille',q:'Une feuille pour toute l’école affichée à l’entrée :',o:ON}
    ]},
    {t:'Autre',qs:[
      {id:'autre',q:'Autre :',o:[],n:{si:[],t:'long',lib:'Note'}}
    ]}
  ];

  let etat={r:{},n:{},ouvert:[0],vue:'form',envoye:false};
  try{const s=localStorage.getItem(CLE);if(s)etat=Object.assign(etat,JSON.parse(s));}catch(e){}
  const $=id=>document.getElementById(id);
  let t;
  function sauver(){try{localStorage.setItem(CLE,JSON.stringify(etat));$('enregistre').textContent='Brouillon enregistré sur ce téléphone';}catch(e){}clearTimeout(t);t=setTimeout(()=>{$('enregistre').textContent='';},1500);}
  function el(tag,attrs,txt){const e=document.createElement(tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e;}

  const noteVue=q=>!!q.n&&(q.n.si.length===0||q.n.si.includes(etat.r[q.id]));
  const repondu=q=>q.o.length?!!etat.r[q.id]:!!(etat.n[q.id]||'').trim();
  function compte(p){return [p.qs.filter(repondu).length,p.qs.length];}
  function majCompteurs(){
    let a=0,b=0;
    PARTIES.forEach((p,i)=>{const [x,y]=compte(p);a+=x;b+=y;const c=$('compte'+i);c.textContent=x+' / '+y+' répondu';c.classList.toggle('plein',x===y);});
    $('total').textContent=a+' / '+b;$('barre').style.width=(a/b*100)+'%';
  }

  function champNote(q,box){
    box.innerHTML='';if(!noteVue(q))return;
    const id='n-'+q.id,l=el('label',{class:'note',for:id});
    const t=el('span',null,q.n.lib);t.append(el('span',{class:'facultatif'},' (facultatif)'));l.append(t);
    const i=q.n.t==='long'?el('textarea',{id:id}):el('input',{id:id,type:q.n.t||'text'});
    if(q.n.t==='number'){i.inputMode='numeric';i.min='0';i.step='500';}
    i.value=etat.n[q.id]||'';i.addEventListener('input',()=>{etat.n[q.id]=i.value;sauver();majCompteurs();});
    l.append(i);box.append(l);
  }
  function question(q){
    const d=el('div',{class:'q'}),lid='l-'+q.id;
    d.append(el('p',{class:'lib',id:lid},q.q));
    const box=el('div');
    if(q.o.length){
      const z=el('div',{class:'puces',role:'group','aria-labelledby':lid});
      q.o.forEach(o=>{const b=el('button',{type:'button',class:'puce','aria-pressed':etat.r[q.id]===o?'true':'false'},o);
        b.addEventListener('click',()=>{etat.r[q.id]=etat.r[q.id]===o?'':o;
          z.querySelectorAll('.puce').forEach(x=>x.setAttribute('aria-pressed',etat.r[q.id]===x.textContent?'true':'false'));
          champNote(q,box);sauver();majCompteurs();});
        z.append(b);});
      d.append(z);
    }
    champNote(q,box);d.append(box);return d;
  }
  function construire(){
    const w=$('parties');
    PARTIES.forEach((p,i)=>{
      const det=el('details',{class:'partie'});if(etat.ouvert.includes(i))det.open=true;
      const s=el('summary');s.append(el('span',{class:'titre'},(i+1)+'. '+p.t),el('span',{class:'compte',id:'compte'+i}),el('span',{class:'fleche','aria-hidden':'true'}));
      det.append(s);const c=el('div',{class:'corps'});if(p.aide)c.append(el('p',{class:'aide'},p.aide));
      p.qs.forEach(q=>c.append(question(q)));det.append(c);
      det.addEventListener('toggle',()=>{etat.ouvert=etat.ouvert.filter(x=>x!==i);if(det.open)etat.ouvert.push(i);sauver();});
      w.append(det);
    });
    majCompteurs();
  }

  function dateFr(v){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?m[3]+'/'+m[2]+'/'+m[1]:v;}
  function texte(){
    let a=0,b=0;PARTIES.forEach(p=>{const [x,y]=compte(p);a+=x;b+=y;});
    const L=['AU COCON : RÉUNION AVEC ANNA, 03/11',a+' / '+b+' questions répondues',''];
    PARTIES.forEach((p,i)=>{
      L.push((i+1)+'. '+p.t.toUpperCase());if(p.aide)L.push('('+p.aide+')');
      p.qs.forEach(q=>{
        let r=q.o.length?(etat.r[q.id]||'(pas répondu)'):'';
        let n=noteVue(q)?(etat.n[q.id]||'').trim():'';
        if(n&&q.n.t==='date')n=dateFr(n);
        if(n&&q.n.lib.includes('(en F)'))n=n+' F';
        if(q.o.length){L.push('- '+q.q+' '+r+(n?' ; '+q.n.lib.replace(' (en F)','')+' : '+n:''));}
        else L.push('- '+q.q+' '+(n||'(rien)'));
      });
      L.push('');
    });
    return L.join('\n').trim();
  }

  function vue(v){
    etat.vue=v;sauver();
    $('parties').hidden=v!=='form';$('vueRecap').hidden=v!=='recap';$('vueFin').hidden=v!=='fin';
    $('pied').hidden=v==='fin';$('piedForm').hidden=v!=='form';$('piedRecap').hidden=v!=='recap';
    if(v==='recap'){$('recap').textContent=texte();$('envoiEtat').textContent='';}
    window.scrollTo({top:0});
    const h=v==='recap'?$('titreRecap'):v==='fin'?$('titreFin'):null;if(h)h.focus({preventScroll:true});
  }
  async function envoyer(){
    const b=$('envoyer');b.disabled=true;$('envoiEtat').textContent='Envoi en cours…';
    try{
      const r=await fetch(ENVOI,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},
        body:JSON.stringify({_subject:SUJET,_gotcha:$('gotcha').value,reponses:texte()})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||j.ok!==true)throw new Error(r.status);
      etat.envoye=true;vue('fin');
    }catch(e){$('envoiEtat').textContent='L’envoi n’a pas marché (réseau ?). Les réponses restent sur ce téléphone : réessaie un peu plus tard.';}
    b.disabled=false;
  }
  $('voir').addEventListener('click',()=>vue('recap'));
  $('modifier').addEventListener('click',()=>vue('form'));
  $('rouvrir').addEventListener('click',()=>vue('form'));
  $('envoyer').addEventListener('click',envoyer);
  $('f').addEventListener('submit',e=>e.preventDefault());
  construire();
  vue(etat.vue==='recap'||etat.vue==='fin'?etat.vue:'form');
})();
</script>
</body>
</html>
