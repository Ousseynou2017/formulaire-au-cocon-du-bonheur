<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'">
<title>Au Cocon, questions 05/11</title>
<style>
:root{
  --violet:#873897; --violet-fonce:#5A2166; --violet-clair:#F6EDF8;
  --fond:#EFE9F1; --carte:#FFFFFF; --encre:#331F3A; --doux:#5A4862; --filet:#EADFEC;
  --f-texte:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--f-texte);font-size:16px;line-height:1.5;overflow-wrap:break-word}
.cadre{max-width:640px;margin:0 auto;padding:32px 16px 48px}
.marque{font-weight:600;color:var(--violet-fonce);font-size:15px;margin:0 0 4px}
h1{font-weight:700;color:var(--violet-fonce);line-height:1.2;margin:0 0 8px;font-size:26px;text-wrap:balance}
.aide{color:var(--doux);font-size:15px;margin:0 0 24px}
.choix{display:flex;flex-direction:column;gap:14px}
.choix a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:76px;padding:18px 20px;border-radius:18px;background:var(--violet);color:#fff;text-decoration:none;font-weight:700;font-size:19px;line-height:1.25;box-shadow:0 6px 18px rgba(90,33,102,.18)}
.choix a span{min-width:0}
.choix a::after{content:"";flex:none;width:11px;height:11px;border-right:3px solid #fff;border-top:3px solid #fff;transform:rotate(45deg)}
.choix a:hover{background:var(--violet-fonce)}
.choix a:active{transform:scale(.98)}
.choix a:focus-visible{outline:3px solid var(--violet-fonce);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.choix a:active{transform:none}}
</style>
</head>
<body>
<main class="cadre">
  <p class="marque">Au Cocon Du Bonheur</p>
  <h1>Quelques questions</h1>
  <p class="aide">Environ 5 minutes. Choisissez votre page.</p>
  <nav class="choix" aria-label="Choisir sa page">
    <a href="directrice.html"><span>Je suis la directrice</span></a>
    <a href="secretaire.html"><span>Je suis la secrétaire</span></a>
  </nav>
</main>
</body>
</html>
